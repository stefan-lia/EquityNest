name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EquityNest.sln

      - name: Build
        run: dotnet build EquityNest.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test EquityNest.sln --configuration Release --no-build --logger "console;verbosity=normal"
